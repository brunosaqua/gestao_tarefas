{% load static %}

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastrar Tarefa</title>

    <link rel="stylesheet" href="{% static 'tarefas/style.css' %}">
</head>

<body>

<div class="container">

    <div class="card">

        <h1>Nova Tarefa</h1>

        <form method="POST">

            {% csrf_token %}

            <label>Título da tarefa</label>

            <input
                type="text"
                name="titulo"
                placeholder="Digite o título"
                required
            >

            <label>Descrição</label>
            <textarea name="descricao" placeholder="Descreva a tarefa"></textarea>

            <label>Data prevista</label>
            <input type="date" name="data_prevista">

            <label>Categoria</label>
            <select name="categoria" required>
                <option value="">Selecione uma categoria</option>
                {% for categoria in categorias %}
                    <option value="{{ categoria.id }}">{{ categoria.nome }}</option>
                {% endfor %}
            </select>

            {% if erro %}<p>{{ erro }}</p>{% endif %}

            <label>Prioridade</label>

            <select name="prioridade">
                <option value="BAIXA">Baixa</option>
                <option value="MEDIA" selected>Média</option>
                <option value="ALTA">Alta</option>
            </select>

            <label>Situação</label>

            <select name="situacao">
                <option value="PENDENTE">Pendente</option>
                <option value="EM_ANDAMENTO">Em andamento</option>
                <option value="CONCLUIDA">Concluída</option>
            </select>

            <button type="submit">
                Cadastrar tarefa
            </button>

        </form>

        <a class="voltar" href="{% url 'lista_tarefas' %}">
            ← Voltar para tarefas
        </a>

    </div>

</div>

</body>
</html>
